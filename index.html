*{

body{
    margin:0;
    min-height:100vh;
    background:

    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:35px 18px 50px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:38px;
    margin:0 0 15px;
    font-weight:bold;
}

.header p{
    color:#aaa;
    font-size:18px;
    line-height:1.8;
    margin:0;
}

.card{
    background:rgba(12,12,14,.94);
    border:1px solid #1d1d20;
    border-radius:30px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

label{
    display:block;
    font-size:18px;
    margin:12px 4px 10px;
    color:#eee;
}
