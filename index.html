.snow {
    position: fixed;
    pointer-events: none !important;
    z-index: 1 !important;
}

.page {
    position: relative;
    z-index: 10;
}

.card {
    position: relative;
    z-index: 20;
}

button {
    position: relative;
    z-index: 100;
    pointer-events: auto !important;
    cursor: pointer;
    touch-action: manipulation;
}
