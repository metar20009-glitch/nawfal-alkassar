<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المعتزل نوفل الكسار</title>

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
}

.box{
    width:90%;
    max-width:600px;
    margin:40px auto;
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:25px;
    padding:25px;
}

h1{
    text-align:center;
    font-size:26px;
    margin-bottom:30px;
}

label{
    display:block;
    color:#aaa;
    margin:15px 5px 8px;
}

input,textarea{
    width:100%;
    box-sizing:border-box;
    background:#151515;
    color:white;
    border:1px solid #333;
    border-radius:15px;
    padding:15px;
    font-size:16px;
    outline:none;
}

input{
    height:60px;
}

textarea{
    height:180px;
    resize:none;
}

button{
    width:100%;
    height:65px;
    margin-top:15px;
    border:0;
    border-radius:18px;
    background:linear-gradient(135deg,#d00000,#700000);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.grid button{
    background:#171717;
    border:1px solid #333;
    font-size:15px;
}

.counter{
    text-align:center;
    color:#aaa;
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid #292929;
}

.number{

    width:50px;
    height:50px;
    align-items:center;
    justify-content:center;
    background:#c00000;
    border-radius:50%;
    color:white;
    margin-right:8px;
    font-weight:bold;
}
