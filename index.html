<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نوفل الكسار</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    width:92%;
    max-width:600px;
    margin:40px auto;
}

.card{
    background:#080808;
    border:1px solid #292929;
    border-radius:30px;
    padding:25px;
}

/* العنوان */

.header{
    display:flex;
    justify-content:flex-start;
    margin-bottom:25px;
}

.english{
    font-size:25px;
}

/* النصوص */

label{
    display:block;
    color:#aaa;
    font-size:18px;
    margin:15px 5px 8px;
}

/* الحقول */

input,
textarea{

    width:100%;

    background:#111;

    color:white;

    border:2px solid #242424;

    border-radius:20px;

    padding:18px;

    font-size:18px;

    font-family:inherit;

    outline:none;
}

input{
    height:70px;
}

textarea{
    height:220px;
    resize:none;
}

input:focus,
textarea:focus{
    border-color:#777;
}

/* الأزرار */

button{

    width:100%;

    border:0;

    font-family:inherit;

    color:white;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.red{

    height:90px;

    margin-top:15px;

    border-radius:25px;

    background:linear-gradient(
        135deg,
        #c90000,
        #760000
    );

    font-size:22px;

    font-weight:bold;
}

.red:active{
    transform:scale(.98);
}

/* الأزرار الصغيرة */

.buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:15px;
}

.small{

    height:80px;

    border-radius:20px;

    background:#0d0d0f;

    border:1px solid #383838;

    font-size:17px;
}

.small:active{
    background:#202020;
}

/* العداد */

.counter-box{

    border-top:2px solid #202020;

    margin-top:30px;

    padding-top:25px;

    text-align:center;

    color:#aaa;

    font-size:19px;
}

.counter{

    display:inline-flex;

    width:55px;

    height:55px;

    align-items:center;

    justify-content:center;

    background:#c90000;

    border-radius:50%;

    color:white;

    margin-right:10px;

    font-size:20px;
}

/* الشريط */

.progress{

    width:100%;

    height:8px;

    background:#111;

    border-radius:20px;

    margin-top:20px;

    overflow:hidden;
}

.progress-bar{

    width:0%;

    height:100%;

    background:#ff5555;

    transition:.3s;
}

/* المطور */

.footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:30px;

    font-size:17px;
}

.footer a{

    color:white;

    text-decoration:none;

    font-weight:bold;
}

/* الثلج */

.snow{

    position:fixed;

    top:-30px;

    z-index:999;

    pointer-events:none;

    color:white;

    animation:fall linear forwards;
}

@keyframes fall{

    from{
        transform:translateY(-30px) rotate(0deg);
    }

    to{
        transform:translateY(110vh) rotate(360deg);
    }

}

</style>
</head>


<body>

<div class="container">

<div class="card">

<!-- English -->

<div class="header">

<div class="english">
🇺🇸 English
</div>

</div>


<!-- البريد -->

<label>
بريد الدعم
</label>

<input
id="email"
type="email"
value="abuse@telegram.org"
>


<!-- الموضوع -->

<label>
الموضوع
</label>

<input
id="subject"
type="text"
placeholder="اكتب موضوع البلاغ"
>


<!-- نص البلاغ -->

<label>
نص البلاغ
</label>

<textarea
id="message"
placeholder="اكتب تفاصيل البلاغ هنا..."
></textarea>


<!-- إرسال -->

<button
class="red"
onclick="sendReport()">

📩 إرسال البلاغ

</button>


<!-- إضافات -->

<button
class="red"
onclick="extras()">

⚡ الإضافات

</button>


<!-- الأزرار -->

<div class="buttons">

<button
class="small"
onclick="copyReport()">

📋 نسخ البلاغ

</button>


<button
class="small"
onclick="previewReport()">

👁️ معاينة

</button>


<button
class="small"
onclick="useText()">

📝 استخدام نص آخر

</button>


<button
class="small"
onclick="resetCounter()">

🔄 تصفير العداد

</button>

</div>


<!-- العداد -->

<div class="counter-box">

عدد البلاغات المرسلة:

<span
class="counter"
id="counter">

0

</span>


<div class="progress">

<div
class="progress-bar"
id="progress">
</div>

</div>

</div>


<!-- المطور -->

<div class="footer">

<span>
تواصل مع المطور
</span>

<a
href="https://t.me/wu_7u"
target="_blank">

@wu_7u

</a>

</div>


</div>

</div>


<script>

let count = 0;


/* إرسال البلاغ */

function sendReport(){

let email =
document.getElementById("email").value;

let subject =
document.getElementById("subject").value;

let message =
document.getElementById("message").value;


if(!subject){

alert("اكتب موضوع البلاغ");

return;

}

if(!message){

alert("اكتب نص البلاغ");

return;

}


count++;

document.getElementById("counter").innerText =
count;

document.getElementById("progress").style.width =
Math.min(count * 10,100) + "%";


let link =
"mailto:" +
email +
"?subject=" +
encodeURIComponent(subject) +
"&body=" +
encodeURIComponent(message);


window.location.href = link;

}


/* نسخ البلاغ */

function copyReport(){

let subject =
document.getElementById("subject").value;

let message =
document.getElementById("message").value;


let text =
"الموضوع:\n" +
subject +
"\n\n" +
"نص البلاغ:\n" +
message;


navigator.clipboard.writeText(text)
.then(function(){

alert("تم نسخ البلاغ 📋");

})
.catch(function(){

alert("تعذر النسخ");

});

}


/* معاينة */

function previewReport(){

let subject =
document.getElementById("subject").value;

let message =
document.getElementById("message").value;


alert(
"الموضوع:\n\n" +
subject +
"\n\n" +
message
);

}


/* استخدام نص آخر */

function useText(){

document.getElementById("subject").value =
"طلب استعادة حسابي في Telegram";

document.getElementById("message").value =
"مرحباً فريق دعم Telegram،\n\nأرجو مساعدتي في استعادة حسابي والتحقق من المشكلة.\n\nشكراً لكم.";

}


/* الإضافات */

function extras(){

alert(
"⚡ الإضافات\n\n" +
"يمكنك استخدام الأزرار الموجودة بالأسفل."
);

}


/* تصفير */

function resetCounter(){

count = 0;

document.getElementById("counter").innerText =
"0";

document.getElementById("progress").style.width =
"0%";

}


/* الثلج */

function snow(){

let s =
document.createElement("div");

s.className="snow";

s.innerText="❄";

s.style.left =
Math.random()*100+"vw";

s.style.fontSize =
(12+Math.random()*20)+"px";

s.style.animationDuration =
(5+Math.random()*6)+"s";

document.body.appendChild(s);

setTimeout(function(){

s.remove();

},12000);

}

setInterval(snow,700);

</script>

</body>
  </html>
