<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نوفل الكسار ༒『⚕️』</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.page{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:55px 18px 40px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    margin:0;
    font-size:38px;
}

.header p{
    color:#aaa;
    font-size:17px;
    line-height:1.8;
    margin-top:15px;
}

.card{
    background:#0b0b0b;
    border:1px solid #1d1d1d;
    border-radius:30px;
    padding:25px 20px;
}

label{
    display:block;
    margin:15px 5px 10px;
    font-size:18px;
}

input,
textarea{
    width:100%;
    border:2px solid #292929;
    background:#181818;
    color:#fff;
    border-radius:18px;
    padding:17px;
    font-size:17px;
    font-family:inherit;
    outline:none;
}

textarea{
    height:180px;
    resize:none;
}

input:focus,
textarea:focus{
    border-color:#8b0000;
}

.red{
    width:100%;
    margin-top:15px;
    padding:18px;
    border:0;
    border-radius:20px;
    background:#800000;
    color:#fff;
    font-size:18px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.btn{
    padding:17px 8px;
    border:1px solid #202020;
    border-radius:18px;
    background:#111;
    color:#fff;
    font-size:16px;
}

.counter{
    text-align:center;
    margin-top:30px;
    padding-top:25px;
    border-top:1px solid #222;
    color:#aaa;
}

.number{
    display:inline-flex;
    width:45px;
    height:45px;
    align-items:center;
    justify-content:center;
    margin-right:8px;
    background:#d00000;
    border-radius:50%;
    color:#fff;
    font-size:19px;
}

.line{
    height:7px;
    background:#171717;
    border-radius:20px;
    margin-top:18px;
}

.line span{
    display:block;
    width:10%;
    height:100%;
    background:#ff5555;
    border-radius:20px;
}

.footer{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
    color:#ddd;
    font-size:14px;
}

.snow{
    position:fixed;
    top:-30px;
    z-index:999;
    color:white;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

@media(max-width:500px){
    .page{
        padding:35px 12px;
    }

    .header h1{
        font-size:32px;
    }

    .card{
        padding:20px 15px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="header">
        <h1>مركز البلاغات</h1>

        <p>
            اكتب موضوع البلاغ والتفاصيل،
            ثم اختر الجهة التي تريد إرسال البلاغ إليها.
        </p>
    </div>

    <div class="card">

        <label>موضوع البلاغ</label>

        <input
            id="subject"
            type="text"
            placeholder="اكتب موضوع البلاغ"
        >

        <label>تفاصيل البلاغ</label>

        <textarea
            id="message"
            placeholder="اكتب تفاصيل البلاغ"
        ></textarea>

        <button class="red" onclick="sendReport()">
            📩 إرسال البلاغ
        </button>

        <button class="red" onclick="alert('الإضافات')">
            ⚡ الإضافات
        </button>

        <div class="grid">

            <button class="btn" onclick="copyReport()">
                📋 نسخ البلاغ
            </button>

            <button class="btn" onclick="preview()">
                👁️ معاينة
            </button>

            <button class="btn" onclick="otherText()">
                📝 استخدام نص آخر
            </button>

            <button class="btn" onclick="resetAll()">
                🔄 تصفير العداد
            </button>

        </div>

        <div class="counter">

            عدد البلاغات المرسلة:

            <span class="number" id="num">0</span>

            <div class="line">
                <span id="bar"></span>
            </div>

        </div>

        <div class="footer">
            <span>المعزول بوقاصد اليافعي</span>
            <span>تواصل مع المطور</span>
        </div>

    </div>

</div>

<script>

let count = 0;

function sendReport(){

    let subject =
        document.getElementById("subject").value.trim();

    let message =
        document.getElementById("message").value.trim();

    if(!subject || !message){
        alert("اكتب موضوع البلاغ والتفاصيل أولاً");
        return;
    }

    count++;

    document.getElementById("num").innerText = count;

    document.getElementById("bar").style.width =
        Math.min(count * 10,100) + "%";

    alert("تم إرسال البلاغ بنجاح ✅");
}

function copyReport(){

    let subject =
        document.getElementById("subject").value;

    let message =
        document.getElementById("message").value;

    let text =
        "موضوع البلاغ:\n" +
        subject +
        "\n\nتفاصيل البلاغ:\n" +
        message;

    navigator.clipboard.writeText(text);

    alert("تم نسخ البلاغ 📋");
}

function preview(){

    let subject =
        document.getElementById("subject").value;

    let message =
        document.getElementById("message").value;

    alert(
        "موضوع البلاغ:\n\n" +
        subject +
        "\n\nتفاصيل البلاغ:\n\n" +
        message
    );
}

function otherText(){

    document.getElementById("subject").value =
        "طلب استعادة حسابي";

    document.getElementById("message").value =
        "السلام عليكم، أرجو مراجعة طلبي ومساعدتي في استعادة حسابي.";
}

function resetAll(){

    count = 0;

    document.getElementById("num").innerText = "0";

    document.getElementById("bar").style.width = "10%";

    document.getElementById("subject").value = "";

    document.getElementById("message").value = "";
}

function snow(){

    let s = document.createElement("div");

    s.className = "snow";

    s.innerText = "❄";

    s.style.left =
        Math.random() * 100 + "vw";

    s.style.fontSize =
        (12 + Math.random() * 15) + "px";

    s.style.animationDuration =
        (5 + Math.random() * 7) + "s";

    document.body.appendChild(s);

    <span>تواصل مع المطور</span>

</div>
