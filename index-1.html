<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نوفل الكسار</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#080808,#1b0000);color:#fff;display:flex;align-items:center;justify-content:center}
.card{width:min(92%,520px);padding:42px 24px;text-align:center;border:1px solid #5d1717;border-radius:28px;background:rgba(15,15,15,.9);box-shadow:0 20px 70px #000}
.logo{width:100px;height:100px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#a40000;font-size:42px;font-weight:900;border:3px solid #e22}
h1{font-size:38px;margin:22px 0 10px}
p{font-size:18px;color:#ddd;margin:0 0 28px}
.badge{display:inline-block;padding:10px 22px;border-radius:999px;background:#a40000;font-weight:bold}
</style>
</head>
<body>
<main class="card">
  <div class="logo">ن</div>
  <h1>نوفل الكسار</h1>
  <p>مرحباً بك في الموقع</p>
  <span class="badge">نوفل الكسار</span>
</main>
</body>
</html>
