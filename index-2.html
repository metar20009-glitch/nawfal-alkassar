<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>༒『⚕️』 — نوفل الكسار</title>
<style>
*{box-sizing:border-box}
:root{--accent:#168cff;--green:#18b86b;--panel:rgba(8,15,24,.88);--border:#3a5065;--text:#f5f7fa;--muted:#a7b6c5}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--text);
background:linear-gradient(rgba(0,0,0,.72),rgba(3,10,17,.82)),url("background.jpg") center/cover fixed no-repeat}
body.light{--panel:rgba(245,248,252,.92);--border:#bdc9d4;--text:#15202b;--muted:#526170;background:linear-gradient(rgba(230,235,240,.68),rgba(220,227,234,.82)),url("background.jpg") center/cover fixed no-repeat}
.wrap{max-width:1120px;margin:auto;padding:24px 16px 45px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--border);border-radius:28px;overflow:hidden;background:rgba(0,0,0,.28)}
.lang button{border:0;background:transparent;color:inherit;padding:10px 18px;cursor:pointer}
.lang .active{background:var(--accent);color:white;border-radius:25px}
.theme{width:46px;height:46px;border:1px solid var(--border);border-radius:13px;background:rgba(0,0,0,.28);color:inherit;font-size:20px;cursor:pointer}
h1{text-align:center;margin:32px 0 6px;font-size:38px}
.lead{text-align:center;color:var(--muted);margin:0 0 25px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px;backdrop-filter:blur(9px);box-shadow:0 18px 60px #0008}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label{display:block;margin:0 0 7px;color:var(--muted);font-size:14px}
input,textarea{width:100%;border:1px solid var(--border);background:#07121de8;color:var(--text);border-radius:11px;padding:14px;font:inherit;outline:0;margin-bottom:15px}
body.light input,body.light textarea{background:#fff;color:#15202b}
textarea{min-height:245px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px #168cff22}
.preview{min-height:330px;border:1px dashed var(--border);border-radius:13px;padding:18px;background:#0003}
.preview h2{margin-top:0}
.empty{color:var(--muted);text-align:center;padding-top:90px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.actions button{border:1px solid var(--border);background:#152536;color:white;border-radius:10px;padding:12px 16px;cursor:pointer}
.actions .blue{background:var(--accent);border-color:var(--accent)}
.actions .green{background:var(--green);border-color:var(--green)}
.tools{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted)}
footer{text-align:center;color:var(--muted);margin-top:25px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#111c28;color:#fff;padding:11px 17px;border-radius:10px;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:780px){.grid{grid-template-columns:1fr}h1{font-size:30px}.card{padding:17px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="lang"><button id="ar" class="active" onclick="language('ar')">العربية</button><button id="en" onclick="language('en')">English</button></div>
  <button class="theme" onclick="theme()">☾</button>
</header>

<h1 id="title">༒『⚕️』 — نوفل الكسار</h1>
<p class="lead" id="lead">إنشاء بلاغ بسهولة واحترافية</p>

<section class="card">
<div class="grid">
<div>
  <label id="emailLabel">البريد الإلكتروني (اختياري)</label>
  <input id="email" type="email" placeholder="example@email.com">

  <label id="subjectLabel">موضوع البلاغ</label>
  <input id="subject" placeholder="اكتب موضوع البلاغ">

  <label id="bodyLabel">نص البلاغ</label>
  <textarea id="body" placeholder="اكتب تفاصيل البلاغ هنا..."></textarea>

  <div class="actions">
    <button class="blue" onclick="preview()">👁 معاينة</button>
    <button class="green" onclick="copyReport()">📋 نسخ النص</button>
    <button onclick="restore()">↩ استرجاع</button>
    <button onclick="clearForm()">🗑 تصفير</button>
  </div>
</div>

<div class="preview">
  <h2 id="previewTitle">معاينة البلاغ 👁</h2>
  <div id="result" class="empty">اكتب الموضوع والنص لرؤية المعاينة هنا</div>
</div>
</div>

<div class="tools">
<span>💾 الحفظ التلقائي مفعل على هذا الجهاز</span>
<span id="count">0 حرف</span>
</div>
</section>
<footer>— صُمم بـ ❤️ لتسهيل عملك —</footer>
</div>
<div id="toast" class="toast">تم النسخ</div>

<script>
const $=id=>document.getElementById(id);
const dataKey="reportDraftV1";

function save(){
 localStorage.setItem(dataKey,JSON.stringify({
  email:$("email").value,subject:$("subject").value,body:$("body").value
 }));
 $("count").textContent=$("body").value.length+" حرف";
}
["email","subject","body"].forEach(id=>$(id).addEventListener("input",()=>{save();preview();}));

function preview(){
 const s=$("subject").value.trim(), b=$("body").value.trim(), e=$("email").value.trim();
 if(!s&&!b){$("result").className="empty";$("result").textContent="اكتب الموضوع والنص لرؤية المعاينة هنا";return}
 $("result").className="";
 $("result").innerHTML="<strong>الموضوع:</strong> "+escapeHtml(s||"—")+"<br><br>"+
 (e?"<strong>البريد:</strong> "+escapeHtml(e)+"<br><br>":"")+
 "<strong>النص:</strong><br>"+escapeHtml(b||"—").replace(/\n/g,"<br>");
}
function escapeHtml(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function reportText(){return `الموضوع: ${$("subject").value}\n\nالبريد: ${$("email").value||"غير مذكور"}\n\n${$("body").value}`;}
async function copyReport(){
 const text=reportText();
 try{await navigator.clipboard.writeText(text);toast("تم نسخ النص");}
 catch(e){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();toast("تم نسخ النص");}
}
function restore(){
 const d=JSON.parse(localStorage.getItem(dataKey)||"null");
 if(!d){toast("لا يوجد نص محفوظ");return}
 $("email").value=d.email||"";$("subject").value=d.subject||"";$("body").value=d.body||"";preview();save();toast("تم الاسترجاع");
}
function clearForm(){
 $("email").value="";$("subject").value="";$("body").value="";preview();save();toast("تم تصفير الحقول");
}
function theme(){document.body.classList.toggle("light");localStorage.setItem("light",document.body.classList.contains("light"))}
if(localStorage.getItem("light")==="true")document.body.classList.add("light");

function language(l){
 const ar=l==="ar";
 document.documentElement.lang=l;document.documentElement.dir=ar?"rtl":"ltr";
 $("ar").classList.toggle("active",ar);$("en").classList.toggle("active",!ar);
 $("title").textContent=ar?"༒『⚕️』 — نوفل الكسار":"༒『⚕️』 — Nawfal Al-Kassar";
 $("lead").textContent=ar?"إنشاء بلاغ بسهولة واحترافية":"Create a report easily and professionally";
 $("emailLabel").textContent=ar?"البريد الإلكتروني (اختياري)":"Email (optional)";
 $("subjectLabel").textContent=ar?"موضوع البلاغ":"Report subject";
 $("bodyLabel").textContent=ar?"نص البلاغ":"Report text";
 $("email").placeholder=ar?"example@email.com":"example@email.com";
 $("subject").placeholder=ar?"اكتب موضوع البلاغ":"Write the report subject";
 $("body").placeholder=ar?"اكتب تفاصيل البلاغ هنا...":"Write the report details here...";
 $("previewTitle").textContent=ar?"معاينة البلاغ 👁":"Report preview 👁";
}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
restore();
</script>
</body>
</html>
